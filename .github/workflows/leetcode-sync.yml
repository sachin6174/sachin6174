name: Sync LeetCode Stats

on:
  schedule:
    # Run twice daily at 00:00 and 12:00 UTC
    - cron: '0 0,12 * * *'
  workflow_dispatch:
  push:
    branches:
      - master
      - main
    paths:
      - 'scripts/**'

permissions:
  contents: write

jobs:
  sync-leetcode:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Generate LeetCode SVG
        run: node scripts/generate-leetcode-svg.js

      - name: Commit and push if changed
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
          git add assets/leetcode.svg
          if git diff --staged --quiet; then
            echo "No changes detected in LeetCode stats."
          else
            git commit -m "📊 Update LeetCode profile graph & statistics [skip ci]"
            git push
          fi
